[project]
name = "cloud-helm"
version = "0.5.0"
description = "Cloud Helm - a lightweight multi-node Docker operations console"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<1",
  "pydantic-settings>=2.10,<3",
]

[project.optional-dependencies]
server = [
  "fastapi>=0.116,<1",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.35,<1",
]
postgres = ["psycopg[binary]>=3.2,<4"]
agent = ["docker>=7.1,<8"]
test = ["pytest>=9.0.3,<10", "pytest-cov>=6.2,<8", "ruff>=0.16,<1"]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cloudhelm*", "cloudhelm_agent*"]

[tool.setuptools.package-data]
cloudhelm = ["static/**/*", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint]
extend-select = ["E402"]
