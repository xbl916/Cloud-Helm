name: cloudhelm
services:
  server:
    build:
      context: .
      dockerfile: deploy/server.Dockerfile
    image: ghcr.io/xbl916/cloud-helm-server:0.6.3
    restart: unless-stopped
    init: true
    read_only: true
    env_file:
      - .env
    ports:
      - "${CLOUDHELM_BIND_ADDRESS:-127.0.0.1}:${CLOUDHELM_PORT:-8080}:8080"
    volumes:
      - ./cloudhelm-data:/data
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
      - SETUID
      - SETGID
      - SETPCAP
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
