name: cloudhelm-agent
services:
  agent:
    build:
      context: ..
      dockerfile: deploy/agent.Dockerfile
    image: ghcr.io/xbl916/cloud-helm-agent:0.5.1
    restart: unless-stopped
    init: true
    read_only: true
    env_file:
      - agent.env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./cloudhelm-data:/data
    tmpfs:
      - /tmp:size=64m,mode=1777
    network_mode: bridge
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
      - SETPCAP
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
