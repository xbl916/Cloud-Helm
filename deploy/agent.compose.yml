name: cloudhelm-agent
services:
  agent:
    build:
      context: ..
      dockerfile: deploy/agent.Dockerfile
    image: ghcr.io/xbl916/cloud-helm-agent:0.6.0
    restart: unless-stopped
    init: true
    read_only: true
    env_file:
      - agent.env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/hostname:/host/rootfs-marker:ro
      - /proc/stat:/host/proc-stat:ro
      - /proc/meminfo:/host/meminfo:ro
      - /proc/loadavg:/host/loadavg:ro
      - /proc/uptime:/host/uptime:ro
      - ./cloudhelm-data:/data
    tmpfs:
      - /tmp:size=64m,mode=1777
    network_mode: host
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
      - SETPCAP
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
