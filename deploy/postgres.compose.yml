name: cloudhelm
services:
  server:
    build:
      context: ..
      dockerfile: deploy/server.Dockerfile
    image: ghcr.io/xbl916/cloud-helm-server:0.5.1
    restart: unless-stopped
    init: true
    read_only: true
    env_file:
      - ../.env
    environment:
      CLOUDHELM_DATABASE_URL: postgresql+psycopg://cloudhelm:${POSTGRES_PASSWORD}@database:5432/cloudhelm
    ports:
      - "${CLOUDHELM_BIND_ADDRESS:-127.0.0.1}:${CLOUDHELM_PORT:-8080}:8080"
    volumes:
      - ../cloudhelm-data:/data
    tmpfs:
      - /tmp:size=64m,mode=1777
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
      - SETUID
      - SETGID
      - SETPCAP
    networks:
      - default
      - backend
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    init: true
    networks:
      - backend
    environment:
      POSTGRES_DB: cloudhelm
      POSTGRES_USER: cloudhelm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./cloudhelm-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudhelm -d cloudhelm"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

networks:
  backend:
    internal: true
